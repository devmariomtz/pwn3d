# ============================================================
# OWASP Dependency-Check - Custom Configuration
# ============================================================
# Documentación: https://jeremylong.github.io/DependencyCheck/dependency-check-maven/configuration.html
#
# Esta configuración reduce falsos positivos y enfoca el escaneo
# en vulnerabilidades realmente explotables en nuestro contexto.
# ============================================================

# ----- NVD API Key (gratis, mejora rate limiting) -----
# Solicítala en: https://nvd.nist.gov/developers/request-an-api-key
# nvd.api.key=YOUR_NVD_API_KEY

# ----- Severidad mínima para fallar el build -----
# Solo CRITICAL (CVSS 9.0-10.0) = explotables remotamente sin auth
failOnCVSS=9

# ----- Remote de datos (si no hay internet, desactivar) -----
autoUpdate=true

# ----- Modos de análisis -----
# Evidencia: basado en regex en nombres de archivo (rápido, más FP)
# NPM/Composer: basado en manifiestos (preciso, menos FP)
analyzer.composer.enabled=true
analyzer.node.audit.enabled=false
analyzer.node.package.enabled=false

# ----- Formatos de reporte -----
# HTML: para revisión humana
# JSON: para procesamiento automático
# CSV:  para importar en hojas de cálculo

# ----- Directorio de datos -----
# dataDirectory=/var/cache/dependency-check

# ----- Suppressions -----
# Rutas a archivos de supresión de falsos positivos
suppressionFile=.github-sec-gates/dependency-check/suppression.xml

# ----- Timeouts -----
# Tiempo máximo de descarga de la NVD (minutos)
connectionTimeout=300000
readTimeout=600000

# ============================================================
# Estrategia de reducción de FP:
#
# 1. subir failOnCVSS a 9 (solo críticos reales)
# 2. Usar el analyzer de composer (más preciso que evidencia)
# 3. Mantener suppression.xml actualizado con FP confirmados
# 4. Revisar mensualmente los FP suprimidos
# ============================================================
