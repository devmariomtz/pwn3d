# ============================================================
# SonarQube - Advanced Project Configuration
# ============================================================
# Estrategia para reducción de falsos positivos:
# 1. Excluir archivos de test, vendor, y generados
# 2. Especificar exclusiones de reglas por archivo/directorio
# 3. Configurar umbrales de Quality Gate más realistas
# 4. Ignorar rule tags no aplicables al contexto
# ============================================================

# ============================================
# Project Identity
# ============================================
sonar.projectKey=notesapp
sonar.projectName=NotesApp
sonar.projectVersion=1.0

# ============================================
# Source Files
# ============================================
sonar.sources=.
sonar.sourceEncoding=UTF-8

# ----- Exclusiones globales (estos archivos NO se analizan) -----
sonar.exclusions=\
  vendor/**,\
  node_modules/**,\
  reports/**,\
  data/**,\
  uploads/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.map,\
  **/*.lock,\
  .github/**,\
  .github-sec-gates/**

# ============================================
# Rule Exclusions (Multi-criteria)
# ============================================
# Formato: sonar.issue.ignore.multicriteria.[id].ruleKey
#          sonar.issue.ignore.multicriteria.[id].resourceKey

# ----- Ejemplo 1: Ignorar regla de "comentarios TODO" en todo el proyecto -----
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1135
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php

# ----- Ejemplo 2: Ignorar "hardcoded credentials" en archivos de config -----
# Regla S2068 genera FP en archivos como config.php donde es esperado
# tener valores de configuración que no son credenciales reales.
# sonar.issue.ignore.multicriteria=e2
# sonar.issue.ignore.multicriteria.e2.ruleKey=php:S2068
# sonar.issue.ignore.multicriteria.e2.resourceKey=**/config.php

# ----- Ejemplo 3: Ignorar "eval() is evil" en archivos específicos -----
# Si tienes un archivo legítimo de debugging (no en prod)
# sonar.issue.ignore.multicriteria=e3
# sonar.issue.ignore.multicriteria.e3.ruleKey=php:S1523
# sonar.issue.ignore.multicriteria.e3.resourceKey=**/debug.php

# ============================================
# Language-Specific
# ============================================
sonar.language=php

# ----- PHP -----
sonar.php.tests=
sonar.php.coverage.reportPaths=

# ----- No analizar archivos HTML/PHP mixtos como HTML -----
sonar.html.file.suffixes=

# ============================================
# Quality Gate (umbrales custom para esta app)
# ============================================
# Por defecto SonarQube usa "Sonar way" Quality Gate.
# Para proyectos legacy o intencionalmente vulnerables como este,
# se puede crear un Quality Gate custom con thresholds más altos.
#
# Parámetros típicos customizados:
# - Blocker issues:     > 0 = FAIL  →  > 10 = FAIL (más permisivo)
# - Critical issues:    > 0 = FAIL  →  > 20 = FAIL
# - Security rating:    A = OK      →  B = OK
#
# Esto se configura desde la UI de SonarQube, no desde properties.

# ============================================
# Duplications
# ============================================
sonar.cpd.exclusions=\
  **/*.html

# ============================================
# Coverage (deshabilitado para esta app demo)
# ============================================
# sonar.coverage.exclusions=\
#   **/*.php

# ============================================
# Analysis Scope (limitar a lo relevante)
# ============================================
# Solo analizar archivos PHP (ignorar CSS, HTML, JS inline)
sonar.import_unknown_files=false

# ============================================
# Server Connection (para CI)
# ============================================
sonar.qualitygate.wait=true
# sonar.host.url=http://localhost:9000
# sonar.login=${SONAR_TOKEN}

# ============================================
# Notas sobre reducción de FP en SonarQube:
#
# 1. Reglas que generan más FP en PHP legacy:
#    - php:S1135 (TODO comments) → ignorar globalmente
#    - php:S1144 (unused methods) → pueden ser hooks/reflexión
#    - php:S1067 (complex expressions) → evaluar caso por caso
#
# 2. Reglas de seguridad que son casi siempre TP:
#    - php:S3649 (SQL injection)      → NUNCA ignorar
#    - php:S5131 (XSS)                → NUNCA ignorar
#    - php:S1523 (eval)               → NUNCA ignorar
#    - php:S2083 (file upload)        → NUNCA ignorar
#    - php:S2077 (SQL injection)      → NUNCA ignorar
#
# 3. Estrategia recomendada:
#    - Primer scan: sin exclusiones → identificar todos los issues
#    - Revisar manualmente los BLOCKER + CRITICAL
#    - Suprimir SOLO tras confirmar que es FP con evidencia
#    - Documentar cada supresión en un ticket de security review
# ============================================================
